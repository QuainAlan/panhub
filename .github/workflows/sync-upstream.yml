name: Sync upstream (merge from fixed upstream)

on:
  schedule:
    - cron: "0 3 * * *" # 每天 03:00 UTC 运行
  workflow_dispatch:

permissions:
  contents: write
  # 注意：不能在这里声明 workflows: write——它不是 workflow 文件 permissions key 的
  # 合法值（GitHub 报 "Unexpected value 'workflows'"），且 GITHUB_TOKEN 永远拿不到
  # workflows 权限（平台硬性安全边界，任何 permissions 声明都无法授予）。
  # 推送 .github/workflows/ 下的文件只能靠带 workflow 权限的 PAT（见 SYNC_TOKEN）。

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 只在 fork 里运行；上游仓库自身无需自同步，避免每天空跑消耗 Actions 配额
    if: github.repository != 'wu529778790/panhub.shenzjd.com'
    env:
      # 固定上游仓库与分支（按需改动）
      UPSTREAM_REPO: wu529778790/panhub.shenzjd.com
      UPSTREAM_BRANCH: main
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # 可选：fork 里配置 SYNC_TOKEN（带 workflow 权限的 PAT：fine-grained 勾选
      # Contents+Workflows 读写，或 classic 勾选 workflow scope）即可连
      # .github/workflows/ 一起同步；未配置时 workflow 文件保持 fork 本地版本
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 配置了 SYNC_TOKEN 就用它（能推送 workflow 文件），否则退回 GITHUB_TOKEN
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || git remote set-url upstream https://github.com/${UPSTREAM_REPO}.git
          # --force：上游重写历史后重建的同名 tag 与本地 sha 不同，
          # 不加会被 git 以 "would clobber existing tag" 拒绝
          git fetch upstream --tags --prune --force

      - name: Determine branches
        id: b
        run: |
          local_default="${DEFAULT_BRANCH:-main}"
          # 兜底：若无 origin/HEAD，尝试识别 main/master
          if ! git rev-parse --verify "origin/$local_default" >/dev/null 2>&1; then
            if git rev-parse --verify origin/main >/dev/null 2>&1; then local_default=main; else local_default=master; fi
          fi
          echo "local_default=$local_default" >> $GITHUB_OUTPUT
          echo "upstream_default=${UPSTREAM_BRANCH}" >> $GITHUB_OUTPUT

      - name: Merge upstream -> fork (no fast-forward)
        run: |
          set -e
          git checkout "${{ steps.b.outputs.local_default }}"
          branch="${{ steps.b.outputs.local_default }}"
          push_args=()
          upstream_ref="upstream/${{ steps.b.outputs.upstream_default }}"
          # 上游重写过历史（如整体重开仓库）时两边没有共同祖先，
          # 普通 merge 会报 "refusing to merge unrelated histories"
          if git merge-base HEAD "${upstream_ref}" >/dev/null 2>&1; then
            # 保留 fork 的提交，合并上游最新提交
            git merge --no-edit "${upstream_ref}"
          else
            echo "::warning::与上游没有共同祖先（上游历史被重写），改用不相关历史合并"
            # -X theirs：内容冲突以上游为准，尽量保住 fork 自己的提交
            if git merge --allow-unrelated-histories --no-edit -X theirs "${upstream_ref}"; then
              push_args+=(--force-with-lease)
            else
              # -X theirs 只能解内容冲突；重命名/增删等冲突解不动时，
              # 兜底硬对齐上游（丢弃 fork 本地提交），保证同步链路不断
              echo "::warning::自动合并失败，回退为硬对齐上游（会丢弃 fork 本地提交）"
              git merge --abort 2>/dev/null || true
              git reset --hard "${upstream_ref}"
              push_args+=(--force-with-lease)
            fi
          fi
          # 未配置 SYNC_TOKEN 时回退 .github/workflows/：GITHUB_TOKEN 推送 workflow
          # 文件会被 GitHub 整次拒绝（refusing to allow a GitHub App to create or
          # update workflow ... without workflows permission），回退后 push 不触碰
          # workflow 文件，永不报错
          if [ -z "${SYNC_TOKEN:-}" ]; then
            # 关键：必须回退到 origin/<branch> 而非 HEAD。merge 之后 HEAD 已是
            # 合并后的上游版本，git checkout HEAD -- .github/workflows 等于没回退，
            # push 仍携带 workflow 变更，被 GITHUB_TOKEN 的 workflows 权限限制
            # 整次拒绝（refusing to allow a GitHub App to create or update workflow）
            git checkout "origin/${branch}" -- .github/workflows
            git commit --no-edit -m "chore(ci): keep local workflow files (no SYNC_TOKEN)" 2>/dev/null || true
          fi
          git push "${push_args[@]}" origin "${branch}"

      - name: Sync tags
        # 上游重写历史后 tag 指向的 sha 会变，需要 --force 才能覆盖 fork 上的旧 tag
        run: git push --force origin --tags
